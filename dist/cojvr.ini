; CoJ Gunslinger VR settings. The VR options in Options > Game are saved in [stereo] below.

[dxvk]
path=dxvk_d3d9.dll

[env]
DXVK_LOG_LEVEL=warn
DXVK_LOG_PATH=cojvr

[vr]
; 0 = play the normal flat game from this copy
enable=1
scene=1
; virtual screen for menus and cutscenes: width and distance in meters
screen_width=3.0
screen_distance=2.5

[links]
; GitHub repository used for the update check and the report page
repo=Senatauro/coj-gunslinger-vr
; 0 = do not check for new versions
update_check=1

[stereo]
