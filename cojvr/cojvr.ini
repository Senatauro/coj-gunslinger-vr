; CoJ VR: configuração (copiada para <jogo>\cojvr\cojvr.ini na 1ª instalação)

[dxvk]
; DLL do DXVK encadeada pelo proxy, relativa a cojvr\
path=dxvk_d3d9.dll

[env]
; variáveis de ambiente aplicadas antes de carregar o DXVK
DXVK_LOG_LEVEL=info
DXVK_LOG_PATH=cojvr

[dev]
; 1 = lê comandos de pad virtual de cojvr\pad.txt (testes automatizados)
pad_script=1

[vr]
; 0 = sem VR (só o proxy)
enable=1
; 1 = aplicação de cena (alvo do mod); 0 = aplicação de overlay (só a tela virtual, para diagnóstico)
scene=1
; tela virtual (modo TELA): largura e distância em metros
screen_width=3.0
screen_distance=2.5

[stereo]
; Estéreo. Os padrões ficam no código; aqui só a documentação. "SET <chave> <valor>" no pad.txt
; muda em tempo real (exceto o modo de vídeo, que vale no boot).
; 1 = modo do olho sem headset (tamanho fake_eye_w x fake_eye_h); com o SteamVR ativo o modo do olho já vale
fake_hmd=0
fake_eye_w=2528
fake_eye_h=2704
; escala do olho (arredondado para múltiplo de 16) e altura da janela do espelho
render_scale=1.0
mirror_height=1080
; 1 = backbuffer A8R8G8B8 em janela; 0 se o CreateDevice falhar
force_argb=1
; -1 = FramePipelining do jogo; 0 = render na thread principal (necessário para o estéreo)
frame_pipelining=0
; 0 = um olho só (mono); 1 = dois olhos
stereo=1
; 1 = os emissores de partículas também simulam no olho D (as partículas divergem entre os olhos)
fx_sim_d=0
; Cabeça e corpo (6DoF), mesma seção. 1 = a cabeça manda no olhar, na mira e na câmera
head=1
; 1 = a câmera do update também leva o roll da cabeça (o render sempre leva)
update_roll=1
; centímetros do jogo por centímetro real (posição da cabeça e IPD)
world_scale=1.0
; 1 = mantém o foco da janela com VR (o jogo ignora o input sem foco)
keep_focus=1
; giro do mod no stick direito (em CENA o jogo não recebe o stick direito): 0 = snap de snap_deg, 1 = suave a smooth_dps
turn=0
snap_deg=45
smooth_dps=180
; fator da velocidade de andar com o headset (fora do sprint); 1 = a do jogo (450 cm/s)
move_speed=0.75
; 1 = agachar com o corpo (cabeça abaixo de 85% da altura em pé agacha, acima de 88% levanta); agachado, a câmera
; fica no máximo a crouch_cap_cm do pé (o olho agachado do jogo fica a 99 cm)
phys_crouch=1
crouch_cap_cm=115
; modos do jogador que vão para a TELA (8 morto, 11 cinemática, 21 diálogo, 29 duelo; também possíveis: 23/25
; Concentração, 30 Sense of Death); a TELA também vale fora do estado "jogando" e sem a câmera FPP. "SET mode 1/2"
; força CENA/TELA
tela_modes=8,11,21,29
; Sense of Death: inclinar a cabeça mais de dodge_cm para um lado esquiva para esse lado (0 = só o analógico)
dodge_lean=1
dodge_cm=15
; 1 = jogar sentado: a câmera fica na altura do olho do jogo (164 cm sobre o pé) e só acompanha a variação da cabeça
seated=0
; a cabeça anda livre até leash_cm do pé no plano; nos 15 cm seguintes a visão escurece até o preto
leash_cm=80
; sem headset: fake_yaw/fake_pitch/fake_roll (graus), fake_x/fake_y/fake_z (cm), fake_height (cm), fake_fps (cadência
; simulada, 0 = livre) e "SET trace <frames>" (âncora e fase do ODE frame a frame no log), via SET
; Armas na mão. 1 = cada arma na pose do controle da mão (0 = armas do jogo)
weapons=1
; 1 = esconde os braços do jogo (armas flutuantes)
hide_arms=1
; pega da arma no frame do controle (padrão do Quest 3): rotação em X (graus) e posição (cm; x espelhado na esquerda)
grip_pitch=-37.4
grip_x=0
grip_y=0.3
grip_z=9.7
; coice visual por tiro: graus, cm para trás e ms até o pico
kick_deg=12
kick_cm=2
kick_ms=45
; vibração por tiro na mão que atirou: ms, Hz, força 0..1
haptic_ms=60
haptic_hz=160
haptic_amp=0.8
; 1 = o tiro não atravessa a cobertura com o cano dentro dela; 1 = mostra a mira 2D do jogo
wall_test=1
crosshair=0
; espalhamento do jogo sem ADS multiplicado por este fator (1 = original)
spread_scale=0.15
; filtro One Euro da mão: rotação (Hz mínimo, beta) e posição (Hz mínimo, beta); hand_filter=0 desliga
hand_min_hz=1.5
hand_beta=1.0
hand_pos_min_hz=4
hand_pos_beta=20
; vibração: 1 = ação do SteamVR, 2 = pulso legado no controle (funciona no Quest via Steam Link), 3 = os dois
haptic_mode=2
; ponto de mira de cada arma (1 = ligado) e seu tamanho angular (graus)
crosshair_vr=1
crosshair_deg=1.5
; dinamite: gatilho = frente da mão × dyn_speed + dyn_up para cima (cm/s); grip = velocidade da mão × dyn_gain;
; dyn_fuse = pavio (s); dyn_fx = fumaça e faíscas do pavio na mão, descendo da ponta (dyn_fx_x/y/z) até a base
; (dyn_fx_bx/by/bz) do pavio conforme ele queima (cm no HandHolder: esquerda, cima, frente)
dyn_speed=1500
dyn_up=300
dyn_gain=1.2
dyn_fuse=3.0
dyn_fx=1
dyn_fx_x=0
dyn_fx_y=5
dyn_fx_z=0
dyn_fx_bx=0
dyn_fx_by=1
dyn_fx_bz=0
; sem headset: fake_hand_x/fake_hand_y/fake_hand_z (cm: direita, cima, frente) e fake_hand_yaw/fake_hand_pitch; "SET
; weapon_log 1" registra tiros e mãos, "SET weapon_dump 1" os ossos da arma
